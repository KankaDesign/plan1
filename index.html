<style>
:root{--bg:#EDF1F9;--card:#fff;--act:#D4DBE9;--tx:#393F4B;--mu:#697792;--ac:#276EF0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--card:#1C2029;--act:#242A35;--tx:#EDF1F9;--mu:#A2AFC8}}
:root[data-theme="dark"]{--bg:#12151C;--card:#1C2029;--act:#242A35;--tx:#EDF1F9;--mu:#A2AFC8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.4 Onest,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 100px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--tx);background:var(--act);border:0;border-radius:16px;padding:10px 14px;width:100%;outline:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:30px;font-weight:800;margin:0;line-height:1.1}
.mu{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{background:var(--card);border-radius:16px;padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:var(--mu)}
.wd b{display:block;font-size:16px;font-weight:700;color:var(--tx)}
.wd.on{background:var(--ac);color:#fff}.wd.on b{color:#fff}
.wd i{display:block;width:5px;height:5px;border-radius:50%;margin:2px auto 0;background:var(--ac)}.wd.on i{background:#fff}
.card{background:var(--card);border-radius:32px;padding:20px;margin-bottom:16px}
.card h2{font-size:20px;font-weight:800;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.t{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-bottom:6px;background:color-mix(in srgb,var(--c) 14%,transparent);border-left:4px solid var(--c)}
.t span{flex:1}.t.d span{text-decoration:line-through;opacity:.5}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.d .ck{background:var(--c)}
.x{color:var(--mu);font-size:18px;padding:0 4px}
.add{display:flex;gap:8px;margin-top:12px}
.add input[type=time]{width:110px;flex:none}
input{min-width:0}

.pill{background:var(--ac);color:#fff;border-radius:100px;padding:10px 18px;font-weight:600;flex:none}
.ghost{background:var(--act);color:var(--tx)}
.dots{display:flex;gap:8px;margin-top:10px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--c)}.dot.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.sub{border-radius:24px;background:var(--act);padding:14px 16px;margin-bottom:8px}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:700}
.chips{display:flex;gap:6px}
.chip{min-width:30px;height:30px;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--c);display:grid;place-items:center;padding:0 8px}
.w{display:flex;gap:10px;align-items:center;margin-top:10px}
.w input{background:var(--card)}
.big{font-size:30px;font-weight:800}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--act);font-size:14px}
.row:last-child{border:0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.nav div{display:flex;gap:6px;background:var(--card);border-radius:100px;padding:6px;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.nav button{padding:10px 24px;border-radius:100px;font-weight:600;color:var(--mu)}
.nav button.on{background:var(--ac);color:#fff}
.ch{text-align:center;font-size:12px;font-weight:600;color:var(--mu);padding-bottom:4px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.empty{color:var(--mu);padding:8px 0}

.mk span{flex:1;color:var(--tx)}
.ng{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.nc{background:var(--act);border-radius:24px;padding:14px;text-align:left;min-height:84px}
.nc b{display:block}.nc span{display:block;color:var(--mu);font-size:13px;overflow:hidden;max-height:3.9em}
.ti{font-size:24px;font-weight:800;background:none;padding:0;margin:12px 0}
textarea{resize:vertical}
.tt{flex:1;text-align:left;font:inherit;color:inherit}
.tt small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.tt small.o{color:var(--tx);font-weight:600}
.t.d .tt{text-decoration:line-through;opacity:.5}
.t.n{background:none;border:1px solid var(--act)}
.mk .tt{color:var(--tx)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:32px 32px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px}
.sheet .dots{margin:0}
.dot.none{border:2px dashed var(--mu);background:none}
.lnk{display:block;margin-top:14px;color:var(--ac);font-weight:600}
.cr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--act);border-radius:20px;padding:10px}
.cr input{flex:1 1 140px;background:var(--card)}
.cr .dot{width:22px;height:22px}
.opt{display:block;width:100%;text-align:left;background:var(--act);border-radius:24px;padding:14px 16px}
.opt b{display:block}.opt span{color:var(--mu);font-size:13px}
.nav button.plus{background:var(--ac);color:#fff;width:44px;height:44px;padding:0;font-size:24px;line-height:1}
.calw{margin-bottom:16px}
.mn b{font-size:20px;font-weight:800}
.cc{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;font-size:14px;color:var(--mu)}
.cc::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--c)}
.cc.on{background:var(--act);color:var(--tx)}
.tk{padding:12px 14px;border-radius:14px;gap:14px}
.tk.n{border:0;border-radius:0;border-bottom:1px solid var(--act);background:none}
.tk .tm{color:var(--mu);font-size:14px;width:46px;flex:none}
.tk .tt{font-size:17px;font-weight:500}
.tk .ck{width:28px;height:28px;border-color:color-mix(in srgb,var(--mu) 50%,transparent)}
.tk.d .ck{background:var(--ac);border-color:var(--ac)}
.dh{font-size:22px;font-weight:800;margin:16px 4px 12px}
.dc{border-left:5px solid var(--ac)}
.topr{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 -6px}
.cd{position:relative;height:clamp(54px,calc((min(100vw,520px) - 32px)/7),72px);min-width:0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px;font-weight:700}
.dn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.cd.td .dn{color:var(--ac)}
.cd.cat .dn{background:var(--c);color:#fff}
.cd.on{box-shadow:inset 0 0 0 2px var(--ac)}
.bars{display:flex;flex-direction:column;gap:2px;width:72%}
.bars i{height:4px;border-radius:4px;background:var(--c)}
.dm{position:absolute;top:5px;right:5px;display:flex;gap:2px}
.dm i{width:6px;height:6px;background:var(--c);transform:rotate(45deg);border-radius:2px}
.wxr{display:flex;align-items:center;gap:14px}
.wxi{font-size:40px;line-height:1}
.wxt{font-size:28px;font-weight:800;line-height:1.1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
label{display:block;font-size:13px;color:var(--mu)}
label input{margin-top:4px}
.seg{display:flex;gap:6px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:100px;background:var(--act);font-weight:600}
.seg .on{background:var(--ac);color:#fff}
@media(min-width:900px){
#app{max-width:1280px;padding:24px 32px 110px}
#app[data-tab=today]{column-count:3;column-gap:20px}
#app[data-tab=today] .top,#app[data-tab=today] .week{column-span:all}
#app[data-tab=today] .card{break-inside:avoid;margin-bottom:20px}
#app[data-tab=cal]{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:28px;align-items:start}
#app[data-tab=cal] .topr{grid-column:1/-1}
#app[data-tab=cal] .calw{grid-column:1;grid-row:2/span 4}
#app[data-tab=cal] .dh{grid-column:2;margin-top:0}
#app[data-tab=cal] .card{grid-column:2}
#app[data-tab=cal] .cd{height:104px}
.dn{width:34px;height:34px;font-size:15px}
.bars i{height:5px}
}
.hb{display:flex;gap:8px}
/* ===== v2 ===== */
.pill{font-size:14px;font-weight:700}
.sh{font-size:15px;font-weight:600}
.dn{font-size:14px}
.tk .tm{font-size:13px;line-height:1.25;white-space:nowrap}
.tm em{display:block;font-style:normal;opacity:.65}
.add label{flex:1}
.add label input[type=time]{width:100%}
.weekw{display:flex;align-items:stretch;gap:6px;margin-bottom:16px}
.weekw .week{flex:1;margin:0;min-width:0}
.wa{width:26px;flex:none;border-radius:14px;background:var(--card);font-size:18px;color:var(--mu)}
.wd{min-width:0;padding:8px 0 6px}
.wn{display:grid;place-items:center;width:28px;height:28px;margin:3px auto 0;border-radius:50%;font-size:15px;font-weight:700;color:var(--tx)}
.wn.ct{background:var(--c);color:#fff}
.wd.on .wn{color:#fff}
.wd.on .wn.ct{background:#fff;color:var(--c)}
.wd:not(.on).td{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ac) 45%,transparent)}
.wdt{display:flex;gap:3px;justify-content:center;height:5px;margin-top:4px}
.wdt em{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cd.td:not(.on){box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ac) 45%,transparent)}
.ng{grid-template-columns:repeat(2,minmax(0,1fr))}
.nc{min-width:0;overflow:hidden}
.nc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:none;word-break:break-word}
.nc small{display:block;margin-top:6px;font-size:11px;color:var(--mu)}
.nv{animation:nvin .24s ease}
@keyframes nvin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.nvb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nti{font:800 26px/1.2 Onest,system-ui,sans-serif;background:none;border-radius:0;padding:0;margin:10px 0 4px;resize:none;overflow:hidden;width:100%}
.nmeta{margin:0 0 14px}
.nbody{background:var(--card);border-radius:24px;padding:18px 20px;font-size:17px;line-height:1.5;min-height:52vh;resize:none}
.sub.cl{background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:inset 4px 0 0 var(--c)}
input,textarea{-webkit-user-select:text;user-select:text}
.t,.sub,.mk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk h2,.blk .sh,.wxr{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk{break-inside:avoid}
.dsrc{opacity:.25}
.dtg{outline:2px dashed var(--ac);outline-offset:2px;border-radius:16px}
body.dr{cursor:grabbing}
</style></head>
<body><div id="app"></div>
<script>
// ===== Синхронизация: впишите адрес проекта (https://....supabase.co) и ПУБЛИЧНЫЙ ключ sb_publishable_... из Supabase.
// Пока поля пустые, планер работает локально, без входа. Секретные ключи (service_role) сюда НЕ вставлять.
const CFG=window.PLANNER_CFG||{url:'https://xxerdueuujjhdnnnsjqy.supabase.co',key:'sb_publishable_781NXZH7stAFq6jGDh7Hrw_yvD7myJQ'};
const COL={blue:'#276EF0',red:'#FC413D',yellow:'#FFBE00',green:'#00AF57',purple:'#8731FF',orange:'#FF6F31',gray:'#7D879C'};
const ST=['red','yellow','green'],STN={red:'Не начата',yellow:'В процессе',green:'Сделано'};
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const wdi=d=>(d.getDay()+6)%7;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2);
const today=iso(new Date());
const K='planner-v1';

function seed(){
  const t={};
  const p=(d,x)=>(t[d]=t[d]||[]).push({id:uid(),done:false,...x});
  p(today,{t:'Анимационный дизайн',c:'blue'});p(today,{t:'ВИР',c:'purple'});p(today,{t:'ВКЦП',c:'orange'});
  p(add(today,1),{t:'Встать',time:'10:00',c:'green'});p(add(today,1),{t:'Разминка',c:'green'});p(add(today,1),{t:'Съёмки',c:'purple'});
  p('2026-10-01',{t:'Врач',time:'10:48',c:'green'});p('2026-10-08',{t:'Врач',time:'15:00',c:'green'});
  p('2026-10-03',{t:'Ногти',c:'orange'});p('2026-10-20',{t:'Экзамен',time:'09:00',c:'red'});p('2026-10-23',{t:'Мама Юля, ДР',c:'purple'});
  const w=(a,b,c)=>[a,b,c].map(s=>({s,c:''}));
  const hw=[{n:'Методы анализа',w:w('green','yellow','red'),open:false},{n:'3D',w:w('green','green','yellow'),open:false},{n:'ВКЦП',w:w('green','yellow','red'),open:false}];
  hw[0].w[1].c='Поправить выводы';
  return{tasks:t,hw,fin:[{d:'2026-09-20',a:47450},{d:'2026-10-03',a:5000}]};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tasks)S=seed();
if(!S.marks){S.marks={};S.tasks['2026-10-23']=(S.tasks['2026-10-23']||[]).filter(x=>x.t!=='Мама Юля, ДР');S.marks['2026-10-23']=[{id:uid(),t:'День рождения мамы Юли',c:'purple'}]}
S.act=S.act||['Сайт-портфолио','Предложить арт','Читать вслух'].map(t=>({id:uid(),t,done:false}));
S.notes=S.notes||[{id:uid(),title:'МФЦ',text:'Взять паспорт и копию. Окно 4.'}];
S.blocks=S.blocks||[];
S.cats=S.cats||[{id:'work',n:'Рабочий',c:'blue'},{id:'off',n:'Выходной',c:'gray'}];S.dayCat=S.dayCat||{};
S.calc=S.calc||{ev:'15:00',travel:120,pm:180,pn:80,buf:15,mk:true};
if(!S.v3){S.v3=1;S.cats.forEach(c=>{if(c.id==='work'&&c.c==='gray')c.c='blue';if(c.id==='off'&&c.c==='green')c.c='gray'});if(!Object.keys(S.dayCat).length)for(let d=1;d<=31;d++){const dt=new Date(2026,9,d);S.dayCat[iso(dt)]=dt.getDay()%6===0?'off':'work'}}
S.goals=S.goals||{'2026-10':['Стажировка / работа','Книги','Английский','Сдать на право','Получить паспорт'].map(t=>({id:uid(),t,st:''}))};
function fixS2(){S.hwst=S.hwst||[{id:'red',n:'Не начата',c:'red'},{id:'yellow',n:'В процессе',c:'yellow'},{id:'green',n:'Сделано',c:'green'}];S.hw=S.hw||[];S.order=S.order||[]}
fixS2();
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('planner-theme',t)}catch(e){}};
if(S.theme)setTheme(S.theme);
const hst=id=>S.hwst.find(x=>x.id===id)||{n:'—',c:'gray'};
const BASE=['wx','day','calc','act','hw','fin','notes'];
function syncOrder(){S.blocks.forEach(b=>{if(!b.id)b.id=uid()});const ids=BASE.concat(S.blocks.map(b=>b.id));S.order=S.order.filter(x=>ids.includes(x));ids.forEach(x=>{if(!S.order.includes(x))S.order.push(x)})}
function insertByTime(arr,t){if(!t.time){arr.push(t);return}const i=arr.findIndex(x=>x.time&&x.time>t.time);if(i<0)arr.push(t);else arr.splice(i,0,t)}
const fd=t=>{if(!t)return'';const d=new Date(t);return d.getDate()+' '+MONG[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes())};
const save=()=>{S._t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};schedPush()};

let goEnd=false;
let V={tab:'today',sel:today,col:'',fin:false,addFin:false,cm:today.slice(0,7)};
const fmt=n=>n.toLocaleString('ru-RU').replace(/\u00a0/g,' ')+' ₽';
const dayName=s=>s===today?'Сегодня':s===add(today,1)?'Завтра':parse(s).getDate()+' '+MONG[parse(s).getMonth()];

function tasksOf(d){return(S.tasks[d]||[]).slice()}
function taskHTML(x,i){return`<div class="t tk ${x.done?'d':''} ${x.c?'':'n'}" style="--c:${COL[x.c]||'var(--mu)'}" data-sg="tasks" data-si="${i}">${x.time?`<span class="tm">${x.time}${x.time2?`<em>${x.time2}</em>`:''}</span>`:''}<button class="tt" data-a="ed" data-e="task" data-id="${x.id}">${esc(x.t)}${x.cm?`<small>${esc(x.cm)}</small>`:''}${x.out?`<small class="o">Итог: ${esc(x.out)}</small>`:''}</button><button class="ck" data-a="done" data-id="${x.id}" aria-label="Отметить">${x.done?'✓':''}</button></div>`}
function dots(sel){return `<button class="dot none ${sel?'':'on'}" data-a="col" data-v="" aria-label="Без цвета"></button>`+Object.keys(COL).map(k=>`<button class="dot ${sel===k?'on':''}" style="--c:${COL[k]}" data-a="col" data-v="${k}" aria-label="${k}"></button>`).join('')}
function addForm(){return`<div class="add"><input id="nt" placeholder="Новая задача"></div><div class="add"><label>с<input id="ntm" type="time"></label><label>до<input id="ntm2" type="time"></label></div><div class="add"><button class="pill" data-a="add">Добавить</button><button class="pill ghost" data-a="more" aria-label="Ещё">⋯</button></div><div id="more" hidden><div class="dots">${dots(V.col)}</div><div class="add"><button class="pill ghost" data-a="addm">Добавить как пометку дня</button></div></div>`}
function week(){

async function push(){

async function pull(){
  if(!SB||!USER)return;
  try{
    const{data,error}=await SB.from('planner_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();

// ===== перетаскивание: долгое нажатие на телефоне, движение мышью на компьютере =====
function arrOf(g){
  if(g==='tasks')return S.tasks[V.sel];
  if(g==='act')return S.act;
  if(g==='hw')return S.hw;
  if(g==='goals')return S.goals[V.cm];

}
let DR=null,dtm=null,d0=null,DJ=0;
function dragTarget(e){
  const t=e.target;
  if(!t.closest||t.closest('input,textarea,select,.sheet,.ov,.nav,.weekw'))return null;
  const row=t.closest('[data-sg]');if(!row)return null;
  if(row.dataset.sg==='blocks'&&!(t.closest('h2,.sh,.wxr')||t===row.firstElementChild))return null;
  return row
}
function dStart(row,x,y){
  const r=row.getBoundingClientRect(),g=row.cloneNode(true);
  g.removeAttribute('data-sg');
  g.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;z-index:60;pointer-events:none;opacity:.96;box-shadow:0 12px 32px rgba(0,0,0,.25);transform:scale(1.02)';
  document.body.appendChild(g);
  row.classList.add('dsrc');document.body.classList.add('dr');
  DR={row,g,grp:row.dataset.sg,si:row.dataset.si,dx:x-r.left,dy:y-r.top,over:null}
}
function dMove(x,y){
  if(!DR)return;
  DR.g.style.left=(x-DR.dx)+'px';DR.g.style.top=(y-DR.dy)+'px';
  let best=null,bd=1e9;
  document.querySelectorAll('[data-sg="'+DR.grp+'"]').forEach(el=>{
    if(el===DR.row)return;
    const r=el.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){best=el;bd=0;return}
    if(bd===0)return;
    const d=Math.hypot((r.left+r.right)/2-x,(r.top+r.bottom)/2-y);
    if(d<bd){bd=d;best=el}
  });
  if(DR.over&&DR.over!==best)DR.over.classList.remove('dtg');
  DR.over=best&&bd<320?best:null;
  if(DR.over)DR.over.classList.add('dtg');
  if(y<70)window.scrollBy(0,-12);else if(y>innerHeight-70)window.scrollBy(0,12)
}
function dEnd(){
  if(!DR)return;
  const{row,g,grp,si,over}=DR;
  g.remove();row.classList.remove('dsrc');document.body.classList.remove('dr');if(over)over.classList.remove('dtg');
  DR=null;DJ=Date.now();
  if(!over)return;
  const arr=arrOf(grp);if(!arr)return;
  const a=grp==='blocks'?arr.indexOf(si):+si,b=grp==='blocks'?arr.indexOf(over.dataset.si):+over.dataset.si;
  if(a>=0&&b>=0&&a!==b){const[it]=arr.splice(a,1);arr.splice(b,0,it);save();render()}
}
document.addEventListener('touchstart',e=>{
  if(DR)return;
  const row=dragTarget(e);if(!row)return;
  const t=e.touches[0];d0={row,x:t.clientX,y:t.clientY};
  clearTimeout(dtm);dtm=setTimeout(()=>{if(d0){dStart(d0.row,d0.x,d0.y);if(navigator.vibrate)navigator.vibrate(15)}},380)
},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(DR){e.preventDefault();dMove(t.clientX,t.clientY);return}
  if(d0&&Math.hypot(t.clientX-d0.x,t.clientY-d0.y)>8){clearTimeout(dtm);d0=null}
},{passive:false});
document.addEventListener('touchend',()=>{clearTimeout(dtm);d0=null;dEnd()});
document.addEventListener('touchcancel',()=>{clearTimeout(dtm);d0=null;dEnd()});
document.addEventListener('mousedown',e=>{if(e.button!==0||DR)return;const row=dragTarget(e);if(row)d0={row,x:e.clientX,y:e.clientY,m:true}});
document.addEventListener('mousemove',e=>{
  if(DR){dMove(e.clientX,e.clientY);return}
  if(d0&&d0.m&&Math.hypot(e.clientX-d0.x,e.clientY-d0.y)>6){const r=d0;d0=null;dStart(r.row,r.x,r.y);dMove(e.clientX,e.clientY)}
});
document.addEventListener('mouseup',()=>{d0=null;dEnd()});
document.addEventListener('click',e=>{if(Date.now()-DJ<350){e.stopPropagation();e.preventDefault()}},true);

// ===== свайп по неделе =====
let sw0=null;
document.addEventListener('touchstart',e=>{const w=e.target.closest&&e.target.closest('.weekw');sw0=w?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw0)return;
  const t=e.changedTouches[0],dx=t.clientX-sw0.x,dy=t.clientY-sw0.y;sw0=null;
  if(Math.abs(dx)>55&&Math.abs(dy)<40){V.sel=add(V.sel,dx<0?7:-7);V.cm=V.sel.slice(0,7);render()}
});
boot();
</script></body></html>

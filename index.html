<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Squirrel</title>
<script>try{var t=localStorage.getItem("planner-theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#276EF0">
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Squirrel">
<meta name="description" content="Squirrel: задачи, календарь, смены, финансы и заметки в одном приложении.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.3/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F9;--card:#fff;--act:#D4DBE9;--tx:#393F4B;--mu:#697792;--ac:#276EF0;--ring:rgba(105,119,146,.5);--ok:#00AF57;--bad:#FC413D;--sh:0 8px 28px rgba(39,110,240,.16);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--card:#1C2029;--act:#242A35;--tx:#EDF1F9;--mu:#A2AFC8;--sh:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151C;--card:#1C2029;--act:#242A35;--tx:#EDF1F9;--mu:#A2AFC8;--sh:0 8px 28px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:400 15px/1.35 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .12s ease,background .2s,opacity .2s}
button:active{transform:scale(.97)}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--act);border:0;border-radius:16px;padding:12px 16px;width:100%;min-width:0;outline:0;-webkit-user-select:text;user-select:text}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.9}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;min-height:46px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);padding:0;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:1280px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
.mu{color:var(--mu);font-size:13px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.hdr h1{font-size:32px;font-weight:800;margin:0;line-height:1.1;letter-spacing:-.3px}
.hl{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--mu);flex-wrap:wrap}
.pc{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;border:1px solid var(--act);background:var(--card);color:var(--tx);font-weight:600;font-size:14px}
.pc::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--c,var(--ac))}
.pc.sh::before{border-radius:3px}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--act);display:grid;place-items:center;color:var(--tx);background:var(--card);flex:none;position:relative}
.hb{display:flex;gap:8px}
.circ small{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px;width:100%}
.wd{background:var(--card);border-radius:16px;padding:8px 0 8px;text-align:center;font-size:12px;font-weight:500;color:var(--mu);min-width:0}
.wd b{display:block;font-size:16px;font-weight:700;color:var(--tx);margin-top:2px}
.wd.td{background:var(--mu);color:#fff}.wd.td b{color:#fff}
.wd.on{background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(39,110,240,.35)}.wd.on b{color:#fff}
.wdt{display:flex;gap:3px;justify-content:center;height:5px;margin-top:3px}
.wdt i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.wd.on .wdt i,.wd.td .wdt i{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
/* seg */
.seg{display:flex;gap:4px;background:var(--act);border-radius:100px;padding:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:8px 16px;border-radius:100px;font-weight:600;font-size:14px;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(39,110,240,.35)}
.seg.m{margin:12px 0}
/* blocks */
.blocks{display:block}
@media(min-width:700px){.blocks{column-count:2;column-gap:16px}}
@media(min-width:960px){.blocks{column-count:3}}
.blk{break-inside:avoid;margin-bottom:16px}
.card{background:var(--card);border-radius:32px;padding:20px;position:relative}
.blk .card{margin:0}
.bc{border-left:6px solid var(--c,transparent);padding-left:18px}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:28px}
.bt{flex:1;text-align:left;font-size:20px;font-weight:800;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.bm{color:var(--mu);font-size:14px;font-weight:500}
.d3{display:flex;gap:3px;padding:8px 4px}.d3 i{width:4px;height:4px;border-radius:50%;background:var(--tx)}
.chv{transition:transform .2s;color:var(--tx)}.col .chv{transform:rotate(-90deg)}
.blk.col .card{padding-top:16px;padding-bottom:16px}.blk.col .bh{margin:0}
.nv{animation:up .26s ease}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes slR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes slL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes chk{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
.slR{animation:slR .24s ease}.slL{animation:slL .24s ease}
/* tasks */
.t{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-bottom:8px;background:var(--tl);border-left:4px solid var(--c);min-height:52px}
.t{background:var(--tl,var(--act))}
:root[data-theme="dark"] .t{background:var(--td,var(--act))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .t{background:var(--td,var(--act))}}
.t.n{background:none!important}
.t.n{background:none;border-left-color:transparent;padding-left:12px}
.t .tm{color:var(--mu);font-size:14px;width:48px;flex:none;line-height:1.25;white-space:nowrap}
.tm em{display:block;font-style:normal;opacity:.65;font-size:12px}
.tt{flex:1;text-align:left;font-size:17px;font-weight:500;min-width:0;word-break:break-word}
.tt small{display:block;color:var(--mu);font-size:13px;font-weight:400;margin-top:1px}
.tt small.o{color:var(--tx);font-weight:600}
.t.d .tt{text-decoration:line-through;opacity:.5}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--ring);flex:none;display:grid;place-items:center;color:#fff}
.ck svg{width:15px;height:15px;stroke-width:3}
.d>.ck,.ck.on{background:var(--ac);border-color:var(--ac);animation:chk .25s}
.t.tc .ck{border-color:var(--c)}.t.tc.d>.ck{background:var(--c);border-color:var(--c)}
.x{color:var(--mu);font-size:18px;padding:4px 6px;line-height:1}
.empty{color:var(--mu);padding:6px 4px 10px}
.mk{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:6px;font-weight:600}
.mk i{width:10px;height:10px;background:var(--c);transform:rotate(45deg);border-radius:2px;flex:none}
.mk .tt{font-size:15px}
.add{display:flex;gap:8px;margin-top:10px;align-items:center}
.add>label{flex:1;font-size:12px;color:var(--mu);font-weight:600}
.add>label input{margin-top:4px}
.add input{border-radius:100px;padding:12px 18px}
.add .ci{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;font-size:20px;font-weight:700;flex:none;display:grid;place-items:center;box-shadow:0 4px 12px rgba(39,110,240,.3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:100px;background:var(--ac);color:#fff;font-weight:700;font-size:15px;padding:0 20px;margin-top:12px}
.btn.g{background:var(--act);color:var(--tx)}
.btn.r{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.btn.sm{min-height:36px;font-size:13px;width:auto;margin:0;padding:0 14px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.lnk{display:block;width:100%;text-align:center;margin-top:12px;color:var(--ac);font-weight:700;font-size:14px}
.nb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:76px;border:1.5px dashed var(--mu);border-radius:32px;color:var(--mu);font-weight:700;font-size:18px;break-inside:avoid}
/* colors */
.dots{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none;position:relative}
.dot.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.dot.none{border:2px dashed var(--mu);background:none}.dot.none.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--mu)}
.dot.more{background:var(--act);color:var(--mu);font-size:12px;font-weight:700;width:auto;border-radius:100px;padding:0 10px;height:26px}
.dot.plus{border:1.5px dashed var(--mu);background:none;color:var(--mu);display:grid;place-items:center;font-size:16px}
.sheet .dots{margin:2px 0}
/* hw */
.hwleg{display:flex;gap:12px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12px;font-weight:600}
.hwleg span{display:flex;gap:5px;align-items:center}.hwleg i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sub{border-radius:28px;background:var(--act);padding:10px 12px 10px 20px;margin-bottom:8px}
.sub.cl{box-shadow:inset 4px 0 0 var(--c)}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:700;font-size:16px;gap:8px;min-height:40px;text-align:left}
.chips{display:flex;gap:6px;flex:none}
.chip{min-width:30px;height:30px;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:var(--c);display:grid;place-items:center;padding:0 8px}
.hwl{margin:2px 0 6px}
.hwr{display:flex;align-items:center;gap:10px;padding:5px 0}
.hwr .chip{flex:none;min-width:34px;width:34px;height:34px;font-size:14px;border-radius:11px}
.hwr>button{flex:1;min-width:0;text-align:left;background:var(--card);border-radius:14px;padding:8px 12px;min-height:34px}
.hwr>button span{flex:1;color:var(--tx);font-size:14px;min-width:0;word-break:break-word}
.hwr>button .hwph{color:var(--mu);opacity:.8}
/* fin, food */
.fr{display:flex;gap:16px;align-items:center}
.ringw{position:relative;width:104px;height:104px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:11;stroke-linecap:round}
.ringw .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.rt b{font-size:17px;font-weight:800}.rt span{font-size:11px;color:var(--mu)}
.fl{flex:1;min-width:0}
.frw{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid var(--act);font-size:12px;color:var(--tx)}
.frw:last-child{border:0}
.frw b{font-size:14px;font-weight:700;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mb{margin-bottom:8px}.mb .mh{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:700}
.mb .mh span{font-size:12px;color:var(--mu);font-weight:600}.mb .mh span b{color:var(--tx)}
.mbar{height:8px;border-radius:8px;background:var(--act);margin-top:3px;overflow:hidden}.mbar i{display:block;height:100%;border-radius:8px;background:var(--c);transition:width .5s ease}
.fc{display:flex;align-items:center;gap:8px;padding:4px 0 4px 8px;border-left:3px solid var(--c);margin-bottom:5px;font-size:13px}
.fc b{margin-left:auto;font-size:14px}
.big{font-size:30px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--act);font-size:14px;align-items:center}
.row:last-child{border:0}
/* notes */
.ng{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:4px}
.nc{background:var(--act);border-radius:28px;padding:14px 16px;text-align:left;min-height:84px;min-width:0;overflow:hidden}
.nc b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mu);font-size:13px;margin-top:2px;word-break:break-word}
.nbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nbar h2{flex:1;text-align:center;margin:0;font-size:18px;font-weight:800}
.nbar input{flex:1;text-align:center;background:none;font-size:18px;font-weight:800;padding:8px;border-radius:12px}
.tb{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tb button{min-width:38px;height:38px;border-radius:12px;font-size:17px;font-weight:600;color:var(--tx);display:grid;place-items:center}
.tb button:active{background:var(--act)}
.ned{background:var(--card);border-radius:28px;padding:20px;min-height:58vh;font-size:17px;line-height:1.5;outline:0;word-break:break-word}
.ned h2{font-size:24px;margin:.4em 0}.ned h3{font-size:19px;margin:.4em 0}.ned:empty::before{content:attr(data-ph);color:var(--mu)}
.nview{max-width:760px;margin:0 auto}
/* schedule */
.sr{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
.sr .st{width:48px;flex:none;border-left:4px solid var(--c);padding-left:6px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600;color:var(--mu);line-height:1.2}
.sr .st b{color:var(--tx)}
.sr .t{flex:1;margin:0;min-height:44px}
.pr{height:12px;border-radius:12px;background:var(--act);overflow:hidden;margin:4px 0 12px}.pr i{display:block;height:100%;background:var(--c,var(--ac));border-radius:12px;transition:width .5s}
/* weather */
.wxr{display:flex;align-items:center;gap:14px}
.wxi{font-size:44px;line-height:1}.wxt{font-size:30px;font-weight:800;line-height:1.1}
.wxf{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
/* calendar */
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mn b{font-size:20px;font-weight:800}
.mn .circ{width:40px;height:40px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ch{text-align:center;font-size:12px;font-weight:600;color:var(--mu);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1/1.05;min-width:0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:2px;font-weight:700}
.cd.e{background:none;pointer-events:none}
.dn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.cd.cat .dn{background:var(--c);color:#fff}
.cd.td{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ac) 55%,transparent)}
.cd.on{background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(39,110,240,.35)}
.cd.on .dn{background:#fff;color:var(--ac)}
.cd.on.cat .dn{color:var(--c)}
.cdt{display:flex;gap:3px;height:5px}.cdt i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cd.on .cdt i{box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.bars{display:none;flex-direction:column;gap:3px;width:70%}.bars i{height:4px;border-radius:4px;background:var(--c)}
.dm{position:absolute;top:5px;right:5px;display:flex;gap:2px}.dm i{width:6px;height:6px;background:var(--c);transform:rotate(45deg);border-radius:2px}
.sf{font-size:9px;font-weight:700;color:#fff;background:var(--c);border-radius:6px;padding:1px 5px;max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:clip}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.cc{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;font-size:14px;color:var(--mu)}
.cc::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--c)}
.cc.on{background:var(--act);color:var(--tx);font-weight:600}
.dh{font-size:22px;font-weight:800;margin:18px 4px 12px}
.gl{display:flex;align-items:center;gap:8px}
.gl.fail .tt{text-decoration:line-through;color:var(--bad)}
.gl.fail .ck{border-color:var(--bad);color:var(--bad)}
.gl.done .tt{text-decoration:line-through;opacity:.5}
@media(min-width:900px){.cd{aspect-ratio:auto;height:96px}.dn{width:34px;height:34px;font-size:15px}.cdt{display:none}.bars{display:flex}.cd.on .bars i{background:#fff!important;opacity:.9}}
/* wide layout */
@media(min-width:1500px){#app{max-width:1840px;padding-left:40px;padding-right:40px}}
.wide{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.wide .calp{position:sticky;top:16px}
.wide .blocks{column-count:3}
@media(max-width:1699px){.wide .blocks{column-count:2}}
.add .ci.g{background:var(--act);color:var(--tx);box-shadow:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.nav>div{pointer-events:auto;display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;width:min(360px,100%);height:62px;background:var(--card);border-radius:100px;box-shadow:0 8px 30px rgba(20,30,60,.18)}
.nav button.tabb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu);padding:6px 0}
.nav button.tabb.on{color:var(--ac)}
.nav .plus{width:60px;height:60px;border-radius:50%;background:var(--ac);color:#fff;margin:-18px auto 0;display:grid;place-items:center;box-shadow:0 0 0 6px color-mix(in srgb,var(--card) 70%,transparent),0 8px 20px rgba(39,110,240,.45)}
.nav .plus svg{width:28px;height:28px;stroke-width:2.2}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(18,24,40,.5);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:32px 32px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:41;display:flex;flex-direction:column;gap:10px;animation:up .26s ease}
.sheet::before{content:'';width:48px;height:5px;border-radius:5px;background:var(--tx);opacity:.85;margin:0 auto 4px;flex:none}
.sheet h3,.dlg h3{margin:0;font-size:22px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--card);border-radius:28px;padding:22px;z-index:61;animation:pop .2s ease;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ov.d2{z-index:60}

const TI=(id,v,ex)=>TCO?`<input id="${id}" type="time" value="${v||''}" ${ex||''}>`:`<input id="${id}" type="text" data-tm inputmode="numeric" maxlength="5" placeholder="чч:мм" value="${v||''}" autocomplete="off" ${ex||''}>`;
const normT=v=>{const m=String(v||'').trim().match(/^(\d{1,2}):?(\d{2})?$/);if(!m)return'';const h=+m[1],i=+(m[2]||0);return h>23||i>59?'':pad(h)+':'+pad(i)};
const tv=id=>normT(val(id));
const fit=(s,sm)=>{const n=String(s==null?'':s).length;return sm?(n<=8?11:n<=12?10:9):(n<=5?19:n<=7?16:n<=9?13:n<=11?11.5:10)};
const CH=b=>`<button class="ib" data-a="btog" data-b="${b.id}" aria-label="${b.col?'Развернуть':'Свернуть'}"><span class="chv">${ic('down')}</span></button>`;
const DM=b=>`<button class="ib" data-a="bmenu" data-b="${b.id}" aria-label="Меню блока">${DOTS3}</button>`;
const wxh=(b,t)=>`<div class="bh"><span class="bt">${t}</span>${CH(b)}${DM(b)}</div>`;
const blk=id=>S.bl[id];
const scr=()=>S.scr.find(s=>s.id===V.scr)||S.scr[0];
const allCols=()=>{const o=[];S.pal.forEach(p=>p.colors.forEach(c=>{if(!o.includes(c))o.push(c)}));return o};
const tasksOf=(d,all)=>(S.tasks[d]||[]).filter(x=>all||isMain()||x.sc===V.scr);
const find=id=>{for(const k in S.tasks){const x=S.tasks[k].find(t=>t.id===id);if(x)return[k,x]}return[]};
function insertByTime(arr,t){if(!t.time){arr.push(t);return}const i=arr.findIndex(x=>x.time&&x.time>t.time);if(i<0)arr.push(t);else arr.splice(i,0,t)}
const hst=id=>S.hwst.find(x=>x.id===id)||{n:'—',c:'#7D879C'};
const fd=t=>{if(!t)return'';const d=new Date(t);return d.getDate()+' '+MONG[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=m=>{m=Math.round(m);return((m>=60?Math.floor(m/60)+' ч ':'')+(m%60?m%60+' мин':'')).trim()||'0'};
const tm2=x=>{const y=((Math.round(x)%1440)+1440)%1440;return pad(Math.floor(y/60))+':'+pad(y%60)};
const m2=s=>{const[h,m]=(s||'0:0').split(':').map(Number);return h*60+m};
// безопасный HTML заметок
function clean(h){const d=new DOMParser().parseFromString('<div>'+(h||'')+'</div>','text/html').body.firstChild;const OK=['B','STRONG','I','EM','U','S','STRIKE','H2','H3','DIV','P','BR','UL','LI'];
 const w=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===1){
  if(c.tagName==='DIV'&&c.classList.contains('ni')){const id=c.dataset.id,wd=c.dataset.w;[...c.attributes].forEach(a=>c.removeAttribute(a.name));c.textContent='';c.setAttribute('class','ni');c.setAttribute('data-id',id||'');c.setAttribute('data-w',wd||'100');return}if(!OK.includes(c.tagName)){const t=document.createTextNode(c.textContent);c.replaceWith(t);return}[...c.attributes].forEach(a=>c.removeAttribute(a.name));w(c)}})};w(d);return d.innerHTML}
const plain=h=>{const d=document.createElement('div');d.innerHTML=clean(h);return d.textContent.trim()};

// ===== Виды =====
const DOTS3='<span class="d3"><i></i><i></i><i></i></span>';
function colorRow(sel,act,opts={}){
 const L=allCols(),n=opts.none!==false;const show=V.mc?L:L.slice(0,10);
 return`<div class="dots">${n?`<button class="dot none ${sel?'':'on'}" data-a="${act}" data-v="" aria-label="Без цвета"></button>`:''}${show.map(c=>`<button class="dot ${hex(sel).toLowerCase()===c.toLowerCase()?'on':''}" style="--c:${c}" data-a="${act}" data-v="${c}" aria-label="${c}"></button>`).join('')}${L.length>10?`<button class="dot more" data-a="mcol">${V.mc?'меньше':'ещё '+(L.length-10)}</button>`:''}</div>`}
function ring(p,c,a,b,r=45){const C=2*Math.PI*r,off=C*(1-Math.max(0,Math.min(1,p)));return`<div class="ringw"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" stroke="var(--act)" style="opacity:.0"/><circle cx="55" cy="55" r="${r}" stroke="${c}" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="--len:${C};--off:${off};animation:draw .9s ease"/></svg><div class="rt"><b style="font-size:${fit(a)}px">${a}</b><span style="font-size:${fit(b,1)}px">${b||''}</span></div></div>`}
function ringSeg(parts,a,b,r=45){const C=2*Math.PI*r,tot=parts.reduce((s,x)=>s+x.v,0)||1;let o=0;return`<div class="ringw"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" stroke="var(--act)"/>${parts.filter(x=>x.v>0).map(x=>{const l=C*x.v/tot,s=`<circle cx="55" cy="55" r="${r}" stroke="${x.c}" stroke-dasharray="${Math.max(l-3,1)} ${C}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</svg><div class="rt"><b style="font-size:${fit(a)}px">${a}</b><span style="font-size:${fit(b,1)}px">${b||''}</span></div></div>`}
function head(){
 const d=parse(V.sel),ct=catOf(V.sel),sh=shiftOf(V.sel);
 return`<div class="hdr"><div><h1>${d.getDate()} ${MONG[d.getMonth()]}</h1><div class="hl"><span>${V.sel===today?'Сегодня':WDF[wdi(d)]}</span>${ct?`<span class="pc" style="--c:${hex(ct.c)}">${esc(ct.n)}</span>`:''}${sh?`<span class="pc sh" style="--c:${hex(sh.c)}">${esc(sh.n)}${sh.s?' '+sh.s+'–'+sh.e:''}</span>`:''}</div></div><div class="hb">${accBtn()}<button class="circ" data-a="theme" aria-label="Тема">${ic('sun')}</button><button class="circ" data-a="set" aria-label="Настройки">${ic('gear')}</button></div></div>`}
const shiftOf=d=>{const id=shMap()[d];return id&&S.sh.types.find(t=>t.id===id)};
function week(){
 const d=parse(V.sel),m=add(V.sel,-wdi(d));
 return`<div class="week">${[0,1,2,3,4,5,6].map(i=>{const s=add(m,i),T=(S.tasks[s]||[]).filter(x=>x.c&&(isMain()||x.sc===V.scr)).slice(0,3);
  return`<button class="wd ${s===V.sel?'on':s===today?'td':''} ${catOf(s)?'cat':''}" ${catOf(s)?`style="--c:${hex(catOf(s).c)}"`:''} data-a="day" data-v="${s}">${WD[i]}<b>${parse(s).getDate()}</b><span class="wdt">${T.map(x=>`<i style="--c:${hex(x.c)}"></i>`).join('')}</span></button>`}).join('')}</div>`}
const scrTabs=()=>`<div class="seg">${S.scr.map(s=>`<button class="${s.id===V.scr?'on':''}" data-a="scr" data-v="${s.id}">${esc(s.n)}</button>`).join('')}</div>`;
// --- задачи
function taskHTML(x){
 const c=x.c?hex(x.c):'';
 return`<div class="t ${c?'tc':'n'} ${x.done?'d':''}" data-sg="tk" data-si="${x.id}" style="${c?cs(c):''}">${x.time?`<span class="tm">${x.time}${x.time2?`<em>${x.time2}</em>`:''}</span>`:''}<button class="tt" data-a="ted" data-id="${x.id}">${esc(x.t)}${x.cm?`<small>${esc(x.cm)}</small>`:''}${x.out?`<small class="o">Итог: ${esc(x.out)}</small>`:''}${(x.rem||x.pin)?`<small>${x.rem?ic('bell')+' '+dl(x.rem.d)+', '+x.rem.t:''}${x.rem&&x.pin?' · ':''}${x.pin?'На виджете':''}</small>`:''}</button><button class="ck" data-a="done" data-id="${x.id}" aria-label="Отметить">${x.done?ic('chk'):''}</button></div>`}
function marksHTML(d){return mkOf(d).map(m=>`<div class="mk" style="--c:${hex(m.c)}"><i></i><button class="tt" data-a="med" data-id="${m.id}">${esc(m.t)}</button><button class="x" data-a="mdel" data-id="${m.id}" aria-label="Удалить">×</button></div>`).join('')}
const en=a=>`data-en="${a}"`;
function addRow(){return`<div class="add"><input id="nt" readonly data-a="tsheet" placeholder="Новая задача" autocomplete="off"><button class="ci" data-a="tsheet" aria-label="Добавить задачу">+</button></div>`}
function dayBlock(b,L){
 const all=L,dn=all.filter(x=>x.done).length,left=all.filter(x=>!x.done).length;
 return`<div class="bh"><button class="bt" data-a="btog" data-b="${b.id}">${esc(b.name)}</button><span class="bm">${dn}/${all.length}</span>${CH(b)}${DM(b)}</div>${b.col?'':`${marksHTML(V.sel)}${all.length?all.map(taskHTML).join(''):'<div class="empty">Пока пусто. Добавьте первую задачу.</div>'}${addRow()}${left?`<button class="lnk" data-a="mv">Перенести невыполненное (${left}) на завтра</button>`:''}`}`}
// --- блоки
function body(b){
 switch(b.type){
 case'day':return dayBlock(b,tasksOf(V.sel));
 case'wx':return wxBody(b);
 case'calc':return calcBody(b);
 case'list':return listBody(b);
 case'hw':return hwBody(b);
 case'fin':return finBody(b);
 case'notes':return notesBody(b);
 case'sched':return schedBody(b);
 case'prog':return progBody(b);
 case'food':return foodBody(b);
 case'cal':return`${head2(b)}${b.col?'':calBlk(b)}`;
 case'cnt':return cntBody(b);
 case'text':return`${head2(b)}${b.col?'':`<textarea data-bt="${b.id}" rows="4" placeholder="Текст">${esc(b.text)}</textarea>`}`}
 return''}
const head2=(b,meta)=>`<div class="bh"><button class="bt" data-a="btog" data-b="${b.id}">${esc(b.name)}</button>${meta||''}${CH(b)}${DM(b)}</div>`;
function blockHTML(id){
 const b=blk(id);if(!b)return'';
 const c=b.c?hex(b.c):'';
 return`<div class="blk ${b.col?'col':''}" data-sg="${b.type==='cal'?'cblocks':'blocks'}" data-si="${id}"><div class="card ${c?'bc':''}" style="${c?'--c:'+c:''}">${body(b)}</div></div>`}
function listBody(b){
 return head2(b)+(b.col?'':`${b.items.length?b.items.map((x,j)=>`<div class="t ${x.c?'tc':'n'} ${x.done?'d':''}" style="${cs(x.c)}" data-sg="li${b.id}" data-si="${j}"><button class="tt" data-a="led" data-b="${b.id}" data-j="${j}">${esc(x.t)}</button><button class="ck" data-a="li" data-b="${b.id}" data-j="${j}" aria-label="Отметить">${x.done?ic('chk'):''}</button><button class="x" data-a="lid" data-b="${b.id}" data-j="${j}" aria-label="Удалить">×</button></div>`).join(''):'<div class="empty">Пока пусто.</div>'}<div class="add"><input id="li${b.id}" ${en('lia')} data-b="${b.id}" placeholder="Добавить" autocomplete="off"><button class="ci" data-a="lia" data-b="${b.id}">+</button></div>`)}
function hwBody(b){
 const meta=b.col?'':'';
 return head2(b)+(b.col?'':`<div class="hwleg">${S.hwst.map(s=>`<span><i style="--c:${hex(s.c)}"></i>${esc(s.n)}</span>`).join('')}</div>${b.subs.map((h,i)=>`<div class="sub ${h.c?'cl':''}" style="${cs(h.c)}" data-sg="hw${b.id}" data-si="${i}"><button class="sh" data-a="hwopen" data-b="${b.id}" data-i="${i}"><span>${esc(h.n)}</span><span class="chips">${h.w.map((w,j)=>`<span class="chip" style="--c:${hex(hst(w.s).c)}" role="button" data-a="cyc" data-b="${b.id}" data-i="${i}" data-j="${j}">${j+1}</span>`).join('')}</span></button>${h.open?`<div class="hwl">${h.w.map((w,j)=>`<div class="hwr"><span class="chip" style="--c:${hex(hst(w.s).c)}" role="button" data-a="cyc" data-b="${b.id}" data-i="${i}" data-j="${j}">${j+1}</span><button style="flex:1;text-align:left" data-a="hwc" data-b="${b.id}" data-i="${i}" data-j="${j}"><span class="${w.c?'':'hwph'}" style="display:block">${w.c?esc(w.c):'комментарий'}</span></button></div>`).join('')}<div class="row2" style="margin-top:6px"><button class="btn sm g" data-a="addw" data-b="${b.id}" data-i="${i}">${b.name==='ДЗ'?'+ Практическая':'+ Пункт'}</button><button class="btn sm g" data-a="hwe" data-b="${b.id}" data-i="${i}">Изменить</button></div></div>`:''}</div>`).join('')}<div class="add"><input id="ns${b.id}" ${en('adds')} data-b="${b.id}" placeholder="${b.name==='ДЗ'?'Новый предмет':'Новая задача'}" autocomplete="off"><button class="ci" data-a="adds" data-b="${b.id}">+</button></div>`)}
// --- финансы
function finSums(b){const m=V.cm;const ms=(b.hist||[]).filter(h=>b.kind==='goal'||h.d.slice(0,7)===m);return ms}
function finBody(b){
 const h=b.hist||[];let inner='';
 if(b.kind==='goal'){
  const s=h.reduce((a,x)=>a+x.a,0),t=b.target||0;
  inner=`<div class="fr">${ring(t?s/t:1,hex(b.c)||'#FFBE00',fmt(s),t?fmt(t):'')}<div class="fl">${h.slice(-4).reverse().map(x=>`<div class="frw" style="${x.c?'border-left:3px solid '+hex(x.c)+';padding-left:6px':''}"><span>${dl(x.d)}</span><b class="${x.a<0?'neg':'pos'}">${x.a<0?'−':'+'} ${fmt(Math.abs(x.a))}</b></div>`).join('')||'<div class="mu">Записей пока нет</div>'}</div></div><div class="row2"><button class="btn" data-a="fadd" data-b="${b.id}" data-v="1">+ Добавить</button><button class="btn g" data-a="fadd" data-b="${b.id}" data-v="-1">+ Вычесть</button></div>`
 }else{
  const ex=finSums(b);const by={};ex.forEach(x=>{if(x.a<0)by[x.cat]=(by[x.cat]||0)+(-x.a)});
  const parts=(b.cats||[]).map(c=>({c:hex(c.c)||'#7D879C',v:by[c.id]||0,n:c.n,id:c.id}));const tot=parts.reduce((a,p)=>a+p.v,0);
  inner=`<div class="fr">${ringSeg(parts,fmt(tot),MON[+V.cm.slice(5)-1])}<div class="fl">${parts.filter(p=>p.v>0).concat(parts.filter(p=>!p.v)).slice(0,4).map(p=>`<div class="fc" style="--c:${p.c}"><span>${esc(p.n)}</span><b>${fmt(p.v)}</b></div>`).join('')||'<div class="mu">Добавьте категории в изменении блока</div>'}</div></div><div class="row2"><button class="btn" data-a="fadd" data-b="${b.id}" data-v="0">+ Добавить</button><button class="btn g" data-a="fhist" data-b="${b.id}">История</button></div>`}
 return head2(b)+(b.col?'':inner)}
// --- питание
function foodBody(b){
 const e=b.en.filter(x=>x.d===V.sel),sum=k=>e.reduce((a,x)=>a+(+x[k]||0),0),g=b.goal;
 const bar=(n,k,c)=>`<div class="mb"><div class="mh">${n}<span><b>${num(sum(k))}</b> / ${num(g[k])}г</span></div><div class="mbar" style="--c:${c}"><i style="width:${Math.min(100,sum(k)/(g[k]||1)*100)}%"></i></div></div>`;
 return head2(b)+(b.col?'':`<div class="fr">${ring(sum('k')/(g.k||1),'#FC413D',num(sum('k')),g.k+' ккал')}<div class="fl">${bar('Белки','p','#276EF0')}${bar('Жиры','f','#FFBE00')}${bar('Углеводы','c','#FC413D')}</div></div><button class="btn" data-a="foodadd" data-b="${b.id}">+ Добавить</button>${e.length?`<div style="margin-top:10px">${e.map(x=>`<div class="t ${x.col?'tc':'n'}" style="${cs(x.col)}"><button class="tt" data-a="foode" data-b="${b.id}" data-id="${x.id}">${esc(x.t||'Приём пищи')}<small>${num(x.k||0)} ккал</small></button><button class="x" data-a="foodd" data-b="${b.id}" data-id="${x.id}" aria-label="Удалить">×</button></div>`).join('')}</div>`:''}`)}
// --- расписание
function schedBody(b){
 const L=b.items.slice().sort((a,z)=>(a.s||'').localeCompare(z.s||''));
 return head2(b)+(b.col?'':`${L.map(x=>`<div class="sr"><div class="st" style="--c:${hex(x.c)||'#276EF0'}"><span>${x.s||''}</span><b>${x.e||''}</b></div><div class="t tc" style="${cs(x.c||'#276EF0')}"><button class="tt" data-a="sched" data-b="${b.id}" data-id="${x.id}">${esc(x.t)}</button><button class="x" data-a="schd" data-b="${b.id}" data-id="${x.id}" aria-label="Удалить">×</button></div></div>`).join('')||'<div class="empty">Пока пусто.</div>'}<div class="add"><input id="sn${b.id}" ${en('schn')} data-b="${b.id}" placeholder="Добавить" autocomplete="off"><button class="ci" data-a="schn" data-b="${b.id}">+</button></div>`)}
// --- прогресс
function progBody(b){
 const n=b.items.length,d=b.items.filter(x=>x.done).length,p=n?Math.round(d/n*100):0;
 return head2(b,`<span class="bm">${p}%</span>`)+(b.col?'':`<div class="pr" style="--c:${hex(b.c)||'#00AF57'}"><i style="width:${p}%"></i></div>${b.items.map((x,j)=>`<div class="t ${x.c?'tc':'n'} ${x.done?'d':''}" style="${cs(x.c)}" data-sg="li${b.id}" data-si="${j}"><button class="tt" data-a="led" data-b="${b.id}" data-j="${j}">${esc(x.t)}</button><button class="ck" data-a="li" data-b="${b.id}" data-j="${j}">${x.done?ic('chk'):''}</button><button class="x" data-a="lid" data-b="${b.id}" data-j="${j}">×</button></div>`).join('')}<div class="add"><input id="li${b.id}" ${en('lia')} data-b="${b.id}" placeholder="Новый шаг" autocomplete="off"><button class="ci" data-a="lia" data-b="${b.id}">+</button></div>`)}
function cntBody(b){const s=(b.hist||[]).reduce((a,h)=>a+h.a,0);
 return head2(b)+(b.col?'':`<div class="big">${num(s)} ${esc(b.unit||'')}</div><div class="add"><input id="ca${b.id}" ${en('cadd')} data-b="${b.id}" type="number" inputmode="decimal" placeholder="Сколько добавить"><button class="ci" data-a="cadd" data-b="${b.id}">+</button></div>${b.hist.slice(-5).reverse().map(h=>`<div class="row"><span>${dl(h.d)}</span><b>+${num(h.a)}</b></div>`).join('')}`)}
// --- заметки
function notesBody(b){
 return head2(b)+(b.col?'':`<div class="ng">${b.notes.map(n=>`<button class="nc ${n.c?'bc2':''}" style="${n.c?'--c:'+hex(n.c):''}" data-a="note" data-b="${b.id}" data-id="${n.id}">${nth(n)}<b>${esc(n.title||'Без названия')}</b>${S.hideNotes?'':`<span>${esc(plain(n.html))}</span>`}</button>`).join('')}</div><button class="btn" data-a="notenew" data-b="${b.id}">+ Новая заметка</button>`)}
const nth=n=>{const m=/data-id="([^"]+)"/.exec(n.html||''),u=m&&S.img&&S.img[m[1]];return u?`<i class="nth" style="background-image:url(${u})"></i>`:''};
function hydrate(h){const d=document.createElement('div');d.innerHTML=clean(h);d.querySelectorAll('.ni').forEach(n=>{const u=(S.img||{})[n.dataset.id];n.style.width=(n.dataset.w||100)+'%';n.setAttribute('contenteditable','false');n.innerHTML=u?`<img src="${u}" draggable="false">`:'<div class="mu" style="padding:20px;text-align:center;line-height:1.3">Фото недоступно</div>'});return d.innerHTML}
function noteView(){
 const b=blk(V.note.b),n=b&&b.notes.find(x=>x.id===V.note.id);if(!n){V.note=null;return''}
 return`<div class="nview nv"><div class="nhd"><div class="nbar"><button class="circ" data-a="noteback" aria-label="Назад">${ic('back')}</button><input data-nt="t" value="${esc(n.title)}" placeholder="Название заметки" ${en('noop')}><button data-a="notemenu" aria-label="Меню">${DOTS3}</button></div><div class="tb">${[['h3','H'],['h2','H1'],['bold','B'],['italic','I'],['norm','Aa'],['strikeThrough','S'],['underline','U']].map(([c,l])=>`<button data-a="fmt" data-v="${c}" aria-label="${c}" style="${c==='bold'?'font-weight:800':c==='italic'?'font-style:italic':c==='strikeThrough'?'text-decoration:line-through':c==='underline'?'text-decoration:underline':''}">${l}</button>`).join('')}<button data-a="imgadd" aria-label="Фото">${ic('img')}</button></div></div><input type="file" id="nimg" accept="image/*" multiple hidden><div class="ned" id="ned" contenteditable="true" data-ph="Текст заметки">${hydrate(n.html)}</div><div class="itb" id="itb" hidden><button data-a="imgcrop" aria-label="Кадрировать">${ic('crop')}</button><input type="range" id="iw" min="20" max="100" step="5" aria-label="Размер фото"><button data-a="imgdup" aria-label="Дублировать фото">${ic('copy')}</button><button data-a="imgdel" aria-label="Удалить фото" style="color:var(--bad)">${ic('trash')}</button></div><div class="mu" style="text-align:center;margin-top:10px">${n.upd?'Изменено '+fd(n.upd):''}</div></div>`}
// --- погода
const tmp=n=>{const r=Math.round(n);return(r>0?'+':r<0?'−':'')+Math.abs(r)+'°'};

 return per}

// ===== Синхронизация и вход =====
let SB=null,USER=null,syncT=null,syncState='ok';
const SI={ok:'☁',saving:'⟳',err:'⚠'};
function setSync(st){syncState=st;const b=document.getElementById('sync');if(b)b.textContent=SI[st]||'☁'}
function accBtn(){return SB&&USER?`<button class="circ" id="sync" data-a="pg" data-v="cloud" aria-label="Синхронизация">${SI[syncState]}</button>`:''}
function schedPush(){if(SB&&USER){setSync('saving');clearTimeout(syncT);syncT=setTimeout(push,1200)}}
async function push(){if(!SB||!USER)return;setSync('saving');try{const{error}=await SB.from('planner_state').upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()});if(error)throw error;setSync('ok');syncRem()}catch(e){setSync('err')}}
const b64u=k=>{const p='='.repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const readRem=()=>{let d=val('erd');const t=tv('ert');if(t&&!d)d=V.sel;return d&&t?{d,t,x:val('erx').trim()}:undefined};
function pinFix(){const a=[];for(const d in S.tasks)S.tasks[d].forEach(t=>{if(t.pin)a.push(t)});if(a.length<2)return;a.sort((x,y)=>(y.pt||0)-(x.pt||0));a.slice(1).forEach(t=>{t.pin=false})}
let remKey='';
async function syncRem(force){if(!SB||!USER)return;
 const now=Date.now(),L=[];for(const d in S.tasks)S.tasks[d].forEach(t=>{if(t.rem&&t.rem.d&&t.rem.t&&!t.done){const at=new Date(t.rem.d+'T'+t.rem.t+':00').getTime();if(at>now-86400000)L.push({id:t.id,user_id:USER.id,fire_at:new Date(at).toISOString(),title:t.rem.x||t.t,body:t.rem.x?t.t:(t.cm||'')})}});
 const key=JSON.stringify(L.map(x=>[x.id,x.fire_at,x.title,x.body]));if(!force&&key===remKey)return;
 try{if(L.length){const{error}=await SB.from('reminders').upsert(L,{onConflict:'user_id,id'});if(error)throw error}
  let q=SB.from('reminders').delete().eq('user_id',USER.id);if(L.length)q=q.not('id','in','('+L.map(x=>'"'+x.id+'"').join(',')+')');
  const{error:e2}=await q;if(e2)throw e2;remKey=key}catch(e){}}
async function pull(){
 if(!SB||!USER)return;
 try{const{data,error}=await SB.from('planner_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();if(error)throw error;
  if(data&&data.data&&data.data.tasks){const r=data.data;
   if((r._t||0)>(S._t||0)){S=migrate(r);fix();setTheme(S.theme);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};if(!V.sh&&!V.note&&!isTyping())render()}
   else if((r._t||0)<(S._t||0))schedPush();
   setSync('ok')}else await push()}catch(e){setSync('err')}}

const compress=f=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)});
function syncNote(){const ed=document.getElementById('ned');if(!ed||!V.note)return;const bl=blk(V.note.b),n=bl&&bl.notes.find(x=>x.id===V.note.id);if(!n)return;const c=ed.cloneNode(true);c.querySelectorAll('.ni').forEach(x=>x.textContent='');n.html=clean(c.innerHTML);n.upd=Date.now();save()}
function selImg(el){document.querySelectorAll('#ned .ni.sel').forEach(x=>x.classList.remove('sel'));const tb=document.getElementById('itb');if(el)el.classList.add('sel');if(tb){tb.hidden=!el;if(el){const r=document.getElementById('iw');if(r)r.value=el.dataset.w||100}}}
function insertImg(url){const ed=document.getElementById('ned');if(!ed)return;const id=uid();S.img[id]=url;ed.focus();const sel=getSelection();
 if(SR&&ed.contains(SR.commonAncestorContainer)){sel.removeAllRanges();sel.addRange(SR)}else{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);sel.removeAllRanges();sel.addRange(r)}
 document.execCommand('insertHTML',false,`<div class="ni" contenteditable="false" data-id="${id}" data-w="100" style="width:100%"><img src="${url}" draggable="false"></div><div><br></div>`);
 syncNote();const el=ed.querySelector('.ni[data-id="'+id+'"]');if(el)selImg(el)}
async function addPhotos(fs){for(const f of fs){try{insertImg(await compress(f))}catch(e){toast('Не удалось добавить фото')}}}
function gcImg(){if(!S.img)return;const u=new Set();Object.values(S.bl).forEach(b=>b.type==='notes'&&b.notes.forEach(n=>{(String(n.html).match(/data-id="[^"]+"/g)||[]).forEach(m=>u.add(m.slice(9,-1)))}));let ch=0;for(const k in S.img)if(!u.has(k)){delete S.img[k];ch=1}if(ch)save()}
function keepCaret(){const ed=document.getElementById('ned');if(!ed||document.activeElement!==ed)return;const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0).cloneRange();let rc=r.getClientRects()[0];
 if(!rc||(!rc.height&&!rc.width)){let n=r.startContainer;if(n.nodeType===1&&n===ed)n=n.childNodes[r.startOffset]||n.lastChild;if(n&&n.nodeType===3)n=n.parentElement;const q=n&&n.getBoundingClientRect&&n.getBoundingClientRect();if(!q)return;rc={top:q.top,bottom:q.bottom}}
 const vv=window.visualViewport,bot=(vv?vv.offsetTop+vv.height:innerHeight)-80,top=150;
 if(rc.bottom>bot)scrollBy({top:rc.bottom-bot+28,behavior:'smooth'});else if(rc.top<top)scrollBy({top:rc.top-top-8,behavior:'smooth'})}
function openCrop(el){
 let cur=S.img[el.dataset.id];if(!cur)return;
 const o=document.createElement('div');o.className='crop';
 o.innerHTML='<div class="cs"><img draggable="false" alt=""><div class="cpb"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div><div class="cbar"><button data-c="0" class="on">Свободно</button><button data-c="1">1:1</button><button data-c="1.3333">4:3</button><button data-c="1.7778">16:9</button><button data-c="r" aria-label="Повернуть">↻</button></div><div class="cbar"><button class="btn g" data-c="x">Отмена</button><button class="btn" data-c="ok">Готово</button></div>';
 document.body.appendChild(o);
 const im=o.querySelector('img'),bx=o.querySelector('.cpb');let B={x:0,y:0,w:0,h:0},asp=0,drag=null;
 const draw=()=>{bx.style.left=B.x+'px';bx.style.top=B.y+'px';bx.style.width=B.w+'px';bx.style.height=B.h+'px'};
 const fitA=()=>{const W=im.clientWidth,H=im.clientHeight;let w=B.w,h=w/asp;if(h>H){h=H;w=h*asp}if(w>W){w=W;h=w/asp}B.w=w;B.h=h;B.x=Math.min(Math.max(0,B.x),W-w);B.y=Math.min(Math.max(0,B.y),H-h)};
 const reset=()=>{const W=im.clientWidth,H=im.clientHeight;B={x:W*.06,y:H*.06,w:W*.88,h:H*.88};if(asp)fitA();draw()};
 im.onload=reset;im.src=cur;
 o.addEventListener('pointerdown',e=>{const t=e.target;if(t.closest&&t.closest('.cpb')){drag={h:t.dataset.h||'m',x:e.clientX,y:e.clientY,B:{...B}};e.preventDefault()}});
 o.addEventListener('pointermove',e=>{if(!drag)return;const W=im.clientWidth,H=im.clientHeight,dx=e.clientX-drag.x,dy=e.clientY-drag.y,s=drag.B,m=40;
  if(drag.h==='m'){B.x=Math.min(Math.max(0,s.x+dx),W-s.w);B.y=Math.min(Math.max(0,s.y+dy),H-s.h)}
  else{const hw=drag.h.includes('w'),hn=drag.h.includes('n');let x1=s.x,y1=s.y,x2=s.x+s.w,y2=s.y+s.h;
   if(hw)x1=Math.min(Math.max(0,s.x+dx),x2-m);else x2=Math.max(Math.min(W,x2+dx),x1+m);
   if(hn)y1=Math.min(Math.max(0,s.y+dy),y2-m);else y2=Math.max(Math.min(H,y2+dy),y1+m);
   if(asp){let w=x2-x1,h=w/asp;const ax=hw?x2:x1,ay=hn?y2:y1,mw=hw?ax:W-ax,mh=hn?ay:H-ay;if(w>mw){w=mw;h=w/asp}if(h>mh){h=mh;w=h*asp}x1=hw?ax-w:ax;x2=x1+w;y1=hn?ay-h:ay;y2=y1+h}
   B={x:x1,y:y1,w:x2-x1,h:y2-y1}}
  draw()});
 const up=()=>{drag=null};o.addEventListener('pointerup',up);o.addEventListener('pointercancel',up);
 o.addEventListener('click',e=>{const bt=e.target.closest&&e.target.closest('[data-c]');if(!bt)return;const c=bt.dataset.c;
  if(c==='x'){o.remove();return}
  if(c==='r'){const cv=document.createElement('canvas'),n=im;cv.width=n.naturalHeight;cv.height=n.naturalWidth;const x=cv.getContext('2d');x.translate(cv.width,0);x.rotate(Math.PI/2);x.drawImage(n,0,0);cur=cv.toDataURL('image/jpeg',.85);im.src=cur;return}
  if(c==='ok'){const k=im.naturalWidth/im.clientWidth,cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(B.w*k));cv.height=Math.max(1,Math.round(B.h*k));cv.getContext('2d').drawImage(im,B.x*k,B.y*k,B.w*k,B.h*k,0,0,cv.width,cv.height);const url=cv.toDataURL('image/jpeg',.85),nid=uid();S.img[nid]=url;el.dataset.id=nid;const ie=el.querySelector('img');if(ie)ie.src=url;syncNote();o.remove();return}
  asp=+c;o.querySelectorAll('.cbar [data-c]').forEach(x=>{if(x.dataset.c!=='r'&&x.dataset.c!=='x'&&x.dataset.c!=='ok')x.classList.toggle('on',x===bt)});if(asp){fitA();draw()}});
}
